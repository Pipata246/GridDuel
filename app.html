<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <title>Grid Duel — тестовый экран</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: radial-gradient(circle at top, #1f2937, #020617);
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        color: #e5e7eb;
      }

      .card {
        padding: 32px 24px;
        border-radius: 24px;
        background: rgba(15, 23, 42, 0.9);
        box-shadow: 0 24px 60px rgba(0, 0, 0, 0.6);
        border: 1px solid rgba(148, 163, 184, 0.2);
        text-align: center;
        max-width: 360px;
        width: 100%;
      }

      .tag {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 4px 10px;
        border-radius: 999px;
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        border: 1px solid rgba(251, 191, 36, 0.6);
        color: #fbbf24;
        margin-bottom: 16px;
      }

      h1 {
        font-size: 24px;
        margin-bottom: 10px;
      }

      p {
        font-size: 14px;
        color: #9ca3af;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="tag">Тестовый экран</div>
      <h1>ПРИВЕТ, ВСЁ РАБОТАЕТ</h1>
      <p>Это заглушка веб‑приложения. Позже сюда добавим реальные режимы игр на звезды.</p>
    </div>
  </body>
</html>
