<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <title>Игры — Stars Duel</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
      :root {
        color-scheme: dark;
        --bg-root: #080714;
        --bg-elevated: #111827;
        --bg-elevated-soft: #0b1020;
        --accent: #6366f1;
        --accent-soft: rgba(99, 102, 241, 0.18);
        --accent-strong: #4f46e5;
        --text-main: #f9fafb;
        --text-muted: #9ca3af;
        --border-subtle: rgba(148, 163, 184, 0.25);
        --nav-bg: rgba(15, 23, 42, 0.96);
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        min-height: 100vh;
        background:
          radial-gradient(circle at top left, rgba(99, 102, 241, 0.18), transparent 55%),
          radial-gradient(circle at bottom right, rgba(236, 72, 153, 0.15), transparent 60%),
          var(--bg-root);
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', sans-serif;
        color: var(--text-main);
        display: flex;
        justify-content: center;
      }

      .app {
        width: 100%;
        max-width: 480px;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        padding: 12px 12px 20px;
      }

      .app-shell {
        flex: 1;
        display: flex;
        flex-direction: column;
        border-radius: 24px;
        background: linear-gradient(145deg, rgba(15, 23, 42, 0.98), rgba(12, 10, 30, 0.98));
        box-shadow:
          0 24px 60px rgba(0, 0, 0, 0.8),
          0 0 0 1px rgba(15, 23, 42, 0.9);
        overflow: hidden;
        position: relative;
      }

      .app-shell::before {
        content: '';
        position: absolute;
        inset: -1px;
        border-radius: inherit;
        padding: 1px;
        background: linear-gradient(135deg, rgba(99, 102, 241, 0.5), rgba(236, 72, 153, 0.4));
        opacity: 0.35;
        -webkit-mask:
          linear-gradient(#000 0 0) content-box,
          linear-gradient(#000 0 0);
        -webkit-mask-composite: xor;
        mask-composite: exclude;
        pointer-events: none;
      }

      .app-inner {
        position: relative;
        z-index: 1;
        display: flex;
        flex-direction: column;
        height: 100%;
      }

      .header {
        padding: 14px 16px 10px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        border-bottom: 1px solid rgba(31, 41, 55, 0.9);
        backdrop-filter: blur(18px);
        background: linear-gradient(to bottom, rgba(15, 23, 42, 0.92), rgba(15, 23, 42, 0.86));
      }

      .header-left {
        display: flex;
        flex-direction: column;
        gap: 2px;
      }

      .app-title {
        font-size: 14px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #6b7280;
      }

      .header-user {
        display: flex;
        align-items: center;
        gap: 4px;
      }

      .header-username {
        font-size: 16px;
        font-weight: 600;
      }

      .header-pill {
        padding: 2px 8px;
        border-radius: 999px;
        border: 1px solid rgba(55, 65, 81, 0.9);
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        color: #6b7280;
      }

      .header-avatar-wrapper {
        display: flex;
        align-items: center;
        justify-content: flex-end;
        flex: 0 0 auto;
      }

      .avatar {
        width: 34px;
        height: 34px;
        border-radius: 999px;
        overflow: hidden;
        border: 1px solid rgba(148, 163, 184, 0.4);
        background: radial-gradient(circle at top left, #4f46e5, #ec4899);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 14px;
        font-weight: 600;
        color: #f9fafb;
      }

      .avatar img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }

      .content {
        flex: 1;
        padding: 16px 16px 72px;
        overflow-y: auto;
      }

      .section-title {
        font-size: 18px;
        font-weight: 600;
        margin-bottom: 6px;
      }

      .section-subtitle {
        font-size: 13px;
        color: var(--text-muted);
        margin-bottom: 16px;
      }

      .empty-card {
        border-radius: 18px;
        padding: 20px 16px;
        background: radial-gradient(circle at top left, rgba(99, 102, 241, 0.25), transparent 55%),
          radial-gradient(circle at bottom right, rgba(236, 72, 153, 0.18), transparent 60%),
          var(--bg-elevated);
        border: 1px solid rgba(129, 140, 248, 0.4);
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .empty-title {
        font-size: 16px;
        font-weight: 600;
      }

      .empty-text {
        font-size: 13px;
        color: var(--text-muted);
      }

      .nav {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        padding: 8px 16px 14px;
        background: linear-gradient(to top, var(--nav-bg), rgba(15, 23, 42, 0.4));
        border-top: 1px solid rgba(31, 41, 55, 0.9);
        display: flex;
        gap: 10px;
      }

      .nav-inner {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 6px;
        width: 100%;
        background: rgba(15, 23, 42, 0.95);
        border-radius: 16px;
        padding: 4px;
        box-shadow: 0 10px 35px rgba(0, 0, 0, 0.7);
        border: 1px solid rgba(15, 23, 42, 0.95);
      }

      .nav-item {
        border-radius: 12px;
        padding: 6px 4px 4px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
        border: none;
        background: transparent;
        color: var(--text-muted);
        font-size: 11px;
        cursor: default;
      }

      .nav-item--active {
        background: linear-gradient(135deg, rgba(99, 102, 241, 0.16), rgba(56, 189, 248, 0.14));
        color: var(--text-main);
      }

      .nav-icon {
        width: 20px;
        height: 20px;
      }

      .nav-icon svg {
        width: 100%;
        height: 100%;
        display: block;
      }

      .nav-icon svg path {
        stroke: currentColor;
      }

      .badge-soon {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 2px 6px;
        border-radius: 999px;
        background: rgba(31, 41, 55, 0.9);
        border: 1px solid rgba(55, 65, 81, 0.9);
        font-size: 9px;
        letter-spacing: 0.15em;
        text-transform: uppercase;
        color: #6b7280;
      }
    </style>
  </head>
  <body>
    <div class="app">
      <div class="app-shell">
        <div class="app-inner">
          <header class="header">
            <div class="header-left">
              <div class="app-title">Stars Duel</div>
              <div class="header-user">
                <div class="header-username" id="username">Гость</div>
              </div>
            </div>
            <div class="header-avatar-wrapper">
              <div class="avatar" id="avatar">
                <span id="avatar-initials">SD</span>
              </div>
            </div>
          </header>

          <main class="content">
            <div class="section-title">Игры</div>
            <div class="section-subtitle">
              Выбирай режим и играй за звезды. Пока что игр нет — скоро добавим первые режимы.
            </div>

            <section class="empty-card">
              <div class="empty-title">Игр ещё нет</div>
              <p class="empty-text">
                Мы только готовим арену. Как только появятся первые режимы, ты увидишь их здесь и сможешь начать
                зарабатывать звёзды.
              </p>
            </section>
          </main>

          <nav class="nav">
            <div class="nav-inner">
              <button class="nav-item nav-item--active" type="button">
                <div class="nav-icon">
                  <svg viewBox="0 0 24 24" fill="none">
                    <path
                      d="M4.75 10.75 11 4.5l6.25 6.25V18a1.5 1.5 0 0 1-1.5 1.5h-3.5v-4.25h-3.5V19.5H6.25A1.5 1.5 0 0 1 4.75 18v-7.25Z"
                      stroke-width="1.6"
                      stroke-linecap="round"
                      stroke-linejoin="round"
                    />
                  </svg>
                </div>
                <div>Игры</div>
              </button>

              <button class="nav-item" type="button">
                <div class="nav-icon">
                  <svg viewBox="0 0 24 24" fill="none">
                    <path
                      d="M5 11.5 11.25 5.5 13 7.25l-4.25 4.25L5 11.5Zm1.75 1.75L9 15.5l6.25-6.25L19 13l-3.75 3.75a5.5 5.5 0 0 1-7.78 0L6.75 13.25Z"
                      stroke-width="1.6"
                      stroke-linecap="round"
                      stroke-linejoin="round"
                    />
                  </svg>
                </div>
                <div>Баланс</div>
              </button>

              <button class="nav-item" type="button">
                <div class="nav-icon">
                  <svg viewBox="0 0 24 24" fill="none">
                    <path
                      d="M6.75 7.5h10.5M6.75 12h6.5M6.75 16.5h3.5"
                      stroke-width="1.6"
                      stroke-linecap="round"
                      stroke-linejoin="round"
                    />
                  </svg>
                </div>
                <div>Матчи</div>
              </button>

              <button class="nav-item" type="button">
                <div class="nav-icon">
                  <svg viewBox="0 0 24 24" fill="none">
                    <path
                      d="M12 12a3.25 3.25 0 1 0 0-6.5 3.25 3.25 0 0 0 0 6.5Zm0 2.25c-3.1 0-5.75 1.6-5.75 3.5V19c0 1.4 2.65 2.5 5.75 2.5s5.75-1.1 5.75-2.5v-1.25c0-1.9-2.65-3.5-5.75-3.5Z"
                      stroke-width="1.6"
                      stroke-linecap="round"
                      stroke-linejoin="round"
                    />
                  </svg>
                </div>
                <div>Профиль</div>
              </button>
            </div>
          </nav>
        </div>
      </div>
    </div>

    <script>
      (function () {
        const tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
        const usernameEl = document.getElementById('username');
        const avatarEl = document.getElementById('avatar');
        const avatarInitialsEl = document.getElementById('avatar-initials');

        function getInitials(name) {
          if (!name) return 'SD';
          const parts = name.trim().split(/\s+/);
          if (parts.length === 1) {
            return parts[0].slice(0, 2).toUpperCase();
          }
          return (parts[0][0] + parts[1][0]).toUpperCase();
        }

        if (tg) {
          tg.ready();

          const user = tg.initDataUnsafe && tg.initDataUnsafe.user;
          if (user) {
            const displayName = user.first_name && user.last_name ? user.first_name + ' ' + user.last_name : user.first_name || user.username || 'Игрок';
            usernameEl.textContent = displayName;

            if (user.photo_url) {
              const img = new Image();
              img.src = user.photo_url;
              img.alt = displayName;
              img.onload = function () {
                avatarEl.innerHTML = '';
                avatarEl.appendChild(img);
              };
              img.onerror = function () {
                avatarInitialsEl.textContent = getInitials(displayName);
              };
            } else {
              avatarInitialsEl.textContent = getInitials(displayName);
            }
          } else {
            usernameEl.textContent = 'Гость';
            avatarInitialsEl.textContent = 'SD';
          }
        } else {
          usernameEl.textContent = 'Гость';
          avatarInitialsEl.textContent = 'SD';
        }
      })();
    </script>
  </body>
</html>
